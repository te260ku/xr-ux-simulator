    );
  });
}

function renderRepositoryPreview(
  sourceName,
  repo,
  rowIndex
) {
  const body =
    $("repositoryPreviewBody");

  if (!body) return;

  body.innerHTML = "";

  const dataRow =
    repo?.dataRows?.[rowIndex];

  if (!dataRow) {
    appendRepositoryPreviewEmpty(
      body,
      "行を選択してください"
    );
    return;
  }

  const id =
    String(dataRow[repo.idIndex] ?? "").trim();

  const pathIndex =
    getRepositoryPathIndex(repo);

  const path =
    pathIndex >= 0
      ? String(dataRow[pathIndex] ?? "").trim()
      : "";

  appendRepositoryPreviewMeta(
    body,
    id,
    path
  );

  const selectedFile =
    state.repositoryPreviewFiles.get(dataRow);

  if (selectedFile) {
    appendRepositoryPreviewMedia(
      body,
      selectedFile.url,
      selectedFile.file.type,
      selectedFile.file.name
    );
    return;
  }

  const folderFile =
    findRepositoryPreviewFile(
      sourceName,
      path
    );

  if (folderFile) {
    appendRepositoryPreviewMedia(
      body,
      getRepositoryPreviewFileUrl(folderFile),
      folderFile.type,
      folderFile.name
    );
    return;
  }

  const mediaType =
    detectPreviewMediaType(path);

  if (!mediaType) {
    appendRepositoryPreviewEmpty(
      body,
      path
        ? "このファイル形式はプレビュー対象外です。"
        : "Pathが設定されていません。"
    );
    return;
  }

  const sourceUrl =
    resolvePreviewSource(path);

  if (!sourceUrl) {
    appendRepositoryPreviewEmpty(
      body,
      "上部の「フォルダ選択」でプレビュー元フォルダを指定すると、このPathから自動でファイルを検索します。"
    );
    return;
  }

  appendRepositoryPreviewMedia(
    body,
    sourceUrl,
    mediaType,
    path
  );
}

function appendRepositoryPreviewMeta(
  body,
  id,
  path
) {
  const meta = document.createElement("div");
  meta.className = "repository-preview-meta";

  const idElement =
    document.createElement("div");

  idElement.className =
    "repository-preview-id";

  idElement.textContent =
    id || "(ID未設定)";

  idElement.title =
    idElement.textContent;

  const fileElement =
    document.createElement("div");

  fileElement.className =
    "repository-preview-file";

  fileElement.textContent =
    path || "(Path未設定)";

  fileElement.title =
    fileElement.textContent;

  meta.append(
    idElement,
    fileElement
  );

  body.appendChild(meta);
}

function appendRepositoryPreviewMedia(
  body,
  sourceUrl,
  mediaType,
  name
) {
  const media =
    document.createElement("div");

  media.className =
    "repository-preview-media";

  if (isImageMediaType(mediaType, name)) {
    const image =
      document.createElement("img");

    image.className =
      "repository-preview-image";

    image.alt = name || "Preview";
    image.src = sourceUrl;

    image.addEventListener("error", () => {
      showPreviewLoadError(media);
    });

    media.appendChild(image);
    body.appendChild(media);
    return;
  }

  if (isAudioMediaType(mediaType, name)) {
    const layout =
      document.createElement("div");

    layout.className =
      "repository-preview-audio-layout";

    const artwork =
      document.createElement("div");

    artwork.className =
      "repository-preview-audio-artwork";

    const note =
      document.createElement("div");

    note.className =
      "repository-preview-audio-note";

    note.textContent = "♫";
    note.setAttribute(
      "aria-hidden",
      "true"
    );

    artwork.appendChild(note);

    const controls =
      document.createElement("div");

    controls.className =
      "repository-preview-audio-controls";

    const audio =
      document.createElement("audio");

    audio.className =
      "repository-preview-audio";

    audio.controls = true;
    audio.preload = "metadata";
    audio.src = sourceUrl;

    audio.addEventListener("error", () => {
      showPreviewLoadError(layout);
    });

    controls.appendChild(audio);
    layout.append(artwork, controls);

    body.appendChild(layout);
    return;
  }

  appendRepositoryPreviewEmpty(
    body,
    "このファイル形式はプレビュー対象外です。"
  );
}

function appendRepositoryPreviewEmpty(
  body,
  message
) {
  const empty =
    document.createElement("div");

  empty.className =
    "repository-preview-empty";

  empty.textContent = message;

  body.appendChild(empty);
}

function showPreviewLoadError(media) {
  media.innerHTML = "";

  const message =
    document.createElement("div");

  message.className =
    "repository-preview-message";

  message.textContent =
    "ファイルを読み込めませんでした。Preview上部でフォルダを指定するか、Path右端の ⋯ から個別に選択してください。";

  media.appendChild(message);
}

function detectPreviewMediaType(path) {
  const value =
    String(path ?? "")
      .split(/[?#]/)[0]
      .toLowerCase();

  if (/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(value)) {
    return "image";
  }

  if (/\.(wav|mp3|ogg|m4a|aac|flac|webm)$/.test(value)) {
    return "audio";
  }

  return "";
}

function isImageMediaType(
  mediaType,
  name
) {
  return String(mediaType ?? "")
      .toLowerCase()
      .startsWith("image/") ||
    mediaType === "image" ||
    detectPreviewMediaType(name) === "image";
}

function isAudioMediaType(
  mediaType,
  name
) {
  return String(mediaType ?? "")
      .toLowerCase()
      .startsWith("audio/") ||
    mediaType === "audio" ||
    detectPreviewMediaType(name) === "audio";
}

function resolvePreviewSource(path) {
  const value =
    String(path ?? "").trim();

  if (!value) return "";

  if (/^(blob:|data:|https?:)/i.test(value)) {
    return value;
  }

  if (/^[a-zA-Z]:[\\/]/.test(value) ||
      /^\\\\/.test(value)) {
    return "";
  }

  try {
    return new URL(
      value.replaceAll("\\", "/"),
      window.location.href
    ).href;
  } catch {
    return "";
  }
}

function deleteRepositoryRow(
  sourceName,
  repo,
  rowIndex
) {
  const dataRow = repo.dataRows[rowIndex];
  if (!dataRow) return;

  const id =
    String(dataRow[repo.idIndex] ?? "").trim();

  if (id) {
    const referencedRows =
      getRepositoryReferenceRows(sourceName, id);

    const message = referencedRows.length > 0
      ? `"${id}" は Scenario の ${referencedRows.length} 行で使用されています。\n\n` +
        `削除すると、そのIDが使われているすべての箇所を空欄にします。\n\n削除しますか？`
      : `"${id}" を削除しますか？`;

    if (!confirm(message)) return;

    clearRepositoryReferences(sourceName, id);
  }

  const preview =
    state.repositoryPreviewFiles.get(dataRow);

  if (preview?.url) {
    URL.revokeObjectURL(preview.url);
  }

  state.repositoryPreviewFiles.delete(dataRow);

  repo.dataRows.splice(rowIndex, 1);
  syncRepositoryIds(repo);

  const selected =
    state.repositorySelections.get(sourceName);

  if (selected === rowIndex) {
    state.repositorySelections.delete(sourceName);
  } else if (selected > rowIndex) {
    state.repositorySelections.set(
      sourceName,
      selected - 1
    );
  }

  renderAll();
}

function renderActiveRepository() {
  const meta = $("repositoryMeta");
  const host = $("repositoryTableHost");
  if (!meta || !host) return;

  meta.innerHTML = "";
  host.innerHTML = "";

  const previewBody =
    $("repositoryPreviewBody");

  if (previewBody) {
    previewBody.innerHTML = "";
  }

  if (state.activeEditor === "scenario" ||
      state.activeEditor === "commandDefinitions") {
    return;
  }

  const source = state.activeEditor;
  const repo = state.repositories.get(source);

  updateRepositoryPreviewFolderStatus(source);

  if (!repo) {
    host.innerHTML =
      `<div class="repository-empty">Repository定義がありません。</div>`;
    return;
  }

  const icon = document.createElement("span");
  icon.className = "file-meta-icon";
  icon.setAttribute("aria-hidden", "true");

  const file = document.createElement("span");
  file.className = "repo-meta-file";
  file.textContent =
    repo.loaded ? repo.fileName : "未読込";
  file.title = file.textContent;

  const count = document.createElement("span");
  count.className = "repo-meta-count";
  count.textContent =
    repo.loaded ? `${repo.ids.length} IDs` : "0 IDs";

  meta.append(icon, file, count);

  if (!repo.loaded) {
    const empty = document.createElement("div");
    empty.className = "repository-empty";
    empty.textContent =
      `${source} のCSVを読み込んでください。`;
    host.appendChild(empty);

    if (previewBody) {
      appendRepositoryPreviewEmpty(
        previewBody,
        "Repositoryを読み込むとプレビューを利用できます。"
      );
    }

    return;
  }

  const wrap = document.createElement("div");
  wrap.className = "repository-table-wrap";

  const table = document.createElement("table");
  table.className =
    "repository-table repository-edit-table";

  table.innerHTML = `
    <thead>
      <tr>
        <th class="repo-grid-col-id">ID</th>
        <th class="repo-grid-col-path">Path</th>
        <th class="repo-grid-col-used" title="Timeline参照数">Refs</th>
        <th class="repo-grid-col-actions"></th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement("tbody");

  repo.dataRows.forEach((dataRow, rowIndex) => {
    const tr = document.createElement("tr");

    tr.classList.toggle(
      "repository-row-selected",
      isSelectedRepositoryRow(
        source,
        rowIndex
      )
    );

    tr.addEventListener("click", event => {
      if (event.target.closest(
        ".repo-delete, .repo-path-picker, .repository-editing"
      )) {
        return;
      }

      selectRepositoryRow(
        source,
        repo,
        rowIndex
      );
    });

    const id =
      String(dataRow[repo.idIndex] ?? "").trim();

    const idTd = document.createElement("td");
    idTd.className = "repo-grid-col-id";
    idTd.appendChild(
      createRepositoryIdCell(
        source,
        repo,
        dataRow,
        rowIndex
      )
    );

    const pathTd = document.createElement("td");
    pathTd.className = "repo-grid-col-path";
    pathTd.appendChild(
      createRepositoryPathCell(
        source,
        repo,
        dataRow,
        rowIndex
      )
    );

    const usedTd = document.createElement("td");
    usedTd.className = "repo-grid-col-used";

    const usedCount = id
      ? getRepositoryReferenceRows(
          source,
          id
        ).length
      : 0;

    const usedCell = document.createElement("span");
    usedCell.className = "repo-used";
    usedCell.classList.toggle(
      "has-reference",
      usedCount > 0
    );
    usedCell.textContent = String(usedCount);

    usedTd.appendChild(usedCell);

    const actionsTd = document.createElement("td");
    actionsTd.className = "repo-grid-col-actions";

    const deleteCell = document.createElement("div");
    deleteCell.className = "row-delete-cell";

    const del = document.createElement("button");
    del.type = "button";
    del.className = "row-delete-icon-button repo-delete";
    del.title = "この行を削除";
    del.setAttribute("aria-label", "この行を削除");

    del.innerHTML = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16"></path>
        <path d="M9 7V4h6v3"></path>
        <path d="M7 7l1 13h8l1-13"></path>
        <path d="M10 11v5"></path>
        <path d="M14 11v5"></path>
      </svg>
    `;

    del.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        deleteRepositoryRow(
          source,
          repo,
          rowIndex
        );
      }
    );

    deleteCell.appendChild(del);
    actionsTd.appendChild(deleteCell);

    tr.append(
      idTd,
      pathTd,
      usedTd,
      actionsTd
    );

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  host.appendChild(wrap);

  const selectedRow =
    state.repositorySelections.get(source);

  if (Number.isInteger(selectedRow) &&
      selectedRow >= 0 &&
      selectedRow < repo.dataRows.length) {
    renderRepositoryPreview(
      source,
      repo,
      selectedRow
    );
  } else if (previewBody) {
    appendRepositoryPreviewEmpty(
      previewBody,
      "行を選択してください"
    );
  }
}

function renderCommandDefinitions() {

  host.innerHTML = "";

  count.textContent =
    `${commandIds.length} commands`;

  meta.append(icon, file, count);

  if (!state.definitionFileName) {
    return;
  }

  if (!commandIds.length) {
    const empty = document.createElement("div");
    empty.className = "repository-empty";
    empty.textContent =
      "Command DefinitionsにCommandがありません。";
    host.appendChild(empty);
    return;
  }

  const wrap = document.createElement("div");
  wrap.className = "repository-table-wrap";

  const table = document.createElement("table");
  table.className = "repository-table";

    <thead>
      <tr>
        <th>Parameter</th>
        <th>Description</th>
      </tr>
    </thead>
  `;

  for (const commandId of commandIds) {
    const definition =
      state.definitions.get(commandId);

    const inputs =

      tbody,
      commandId,

        input

  wrap.appendChild(table);
  host.appendChild(wrap);
}

function appendEmptyCommandDefinitionRow(tbody) {
  const tr = document.createElement("tr");
  tr.className = "definition-parameter-row";

  const parameter = document.createElement("td");
  parameter.className =
    "definition-empty-parameter";
  parameter.textContent = "No inputs";

  const description = document.createElement("td");
  description.textContent = "—";

  tr.append(parameter, description);
  tbody.appendChild(tr);
}

function appendCommandDefinitionInputRow(
  tbody,
  input
) {
  const tr = document.createElement("tr");
  tr.className = "definition-parameter-row";

  const parameterTd =
    document.createElement("td");

  const parameterName =
    document.createElement("div");

  parameterName.className =
    "definition-parameter-name";

  parameterName.textContent =
    getArgDisplayName(input);

  parameterName.title =
    getArgDisplayName(input);

  parameterTd.appendChild(parameterName);

  const descriptionTd =
    document.createElement("td");

  descriptionTd.className =
    "definition-description";

  descriptionTd.textContent =
    input.description || "—";

  descriptionTd.classList.toggle(
    "is-empty",
    !input.description
  );

  tr.append(
    parameterTd,
    descriptionTd
  );

  tbody.appendChild(tr);
}


function addRow() {
  if (!state.definitionOrder.length) {
    alert("先にCommand Definition JSONを読み込んでください。");
    return;
  }

  if (!state.rows.length) {
    state.rows.push(
      createEmptyTimelineRow("0")
    );
    state.selectedIndex = 0;
    renderAll();
    return;
  }

  if (state.selectedIndex < 0 ||
      state.selectedIndex >= state.rows.length) {
    alert("追加位置を決めるため、行を選択してください。");
    return;
  }

  const insertIndex =
    state.selectedIndex + 1;

  const time =
    state.rows[state.selectedIndex].time;

  state.rows.splice(
    insertIndex,
    0,
    createEmptyTimelineRow(time)
  );

  state.selectedIndex =
    insertIndex;

  renderAll();
}

function createEmptyTimelineRow(time) {
  return {
    time: String(time ?? "0"),
    command: "",
    args: []
  };
}

function duplicateRow() {
  if (state.selectedIndex < 0) return;
  const src = state.rows[state.selectedIndex];
  const copy = {
    time: src.time,
    command: src.command,
    args: [...src.args]
  };
  state.rows.splice(state.selectedIndex + 1, 0, copy);
  state.selectedIndex++;
  renderAll();
}

function deleteRowAt(rowIndex) {
  if (rowIndex < 0 ||
      rowIndex >= state.rows.length) {
    return;
  }

  state.rows.splice(rowIndex, 1);
  updateSelectionAfterRowDelete(rowIndex);
  renderAll();
}

function updateSelectionAfterRowDelete(rowIndex) {
  if (!state.rows.length) {
    state.selectedIndex = -1;
    return;
  }

  if (state.selectedIndex > rowIndex) {
    state.selectedIndex--;
    return;
  }

  if (state.selectedIndex === rowIndex) {
    state.selectedIndex =
      Math.min(rowIndex, state.rows.length - 1);
  }
}

function moveRow(delta) {
  const i = state.selectedIndex;
  const j = i + delta;
  if (i < 0 || j < 0 || j >= state.rows.length) return;
  [state.rows[i], state.rows[j]] = [state.rows[j], state.rows[i]];
  state.selectedIndex = j;
  renderAll();
}

function moveRow(direction) {
  const index = state.selectedIndex;
  if (index < 0) return;

  const nextIndex = index + direction;
  if (nextIndex < 0 ||
      nextIndex >= state.rows.length) {
    return;
  }

  const temp = state.rows[index];
  state.rows[index] = state.rows[nextIndex];
  state.rows[nextIndex] = temp;
  state.selectedIndex = nextIndex;

  renderAll();
}

function applySort() {
  if (state.rows.length < 2) return;

  const selectedRow =
    state.selectedIndex >= 0 ? state.rows[state.selectedIndex] : null;

  state.rows = state.rows
    .map((row, originalIndex) => ({
      row,
      originalIndex,
      time: Number(row.time),
      command: String(row.command ?? "")
    }))
    .sort((a, b) => {
      const aTimeValid = Number.isFinite(a.time);
      const bTimeValid = Number.isFinite(b.time);

      // Time sort is always the primary key once selected.
      if (state.timeSortDirection) {
        if (aTimeValid && !bTimeValid) return -1;
        if (!aTimeValid && bTimeValid) return 1;

        if (aTimeValid && bTimeValid) {
          const timeDiff = a.time - b.time;
          if (timeDiff !== 0) {
            return state.timeSortDirection === "desc"
              ? -timeDiff
              : timeDiff;
          }
        }
      }

      // Command sort is the secondary key.
      if (state.commandSortDirection) {
        const commandDiff = a.command.localeCompare(
          b.command,
          undefined,
          { sensitivity: "base" }
        );

        if (commandDiff !== 0) {
          return state.commandSortDirection === "desc"
            ? -commandDiff
            : commandDiff;
        }
      }

      // Stable ordering for otherwise equal rows.
      return a.originalIndex - b.originalIndex;
    })
    .map(x => x.row);

  state.selectedIndex = selectedRow
    ? state.rows.indexOf(selectedRow)
    : -1;

  renderAll();
}

function sortScenario(
  key,
  direction
) {
  if (key === "time") {
    state.timeSortDirection =
      direction;
  }

  if (key === "command") {
    state.commandSortDirection =
      direction;
  }

  applySort();
}

function updateScenarioToolbarState() {
  const hasDefinition =
    Boolean(state.definitionFileName);

  const hasSelection =
    state.selectedIndex >= 0 &&
    state.selectedIndex < state.rows.length;

  $("addBtn").disabled =
    !hasDefinition;

  $("duplicateBtn").disabled =
    !hasDefinition ||
    !hasSelection;

  $("upBtn").disabled =
    !hasDefinition ||
    !hasSelection ||
    state.selectedIndex === 0;

  $("downBtn").disabled =
    !hasDefinition ||
    !hasSelection ||
    state.selectedIndex === state.rows.length - 1;

  $("scenarioFileButtonLabel").disabled =
    !hasDefinition;

  $("scenarioFile").disabled =
    !hasDefinition;

  $("validateBtn").disabled =
    !hasDefinition;

  $("exportBtn").disabled =
    !hasDefinition;
}

function findTimelineTimeOrderError() {
  for (let i = 1; i < state.rows.length; i++) {
    const previous =
      Number(state.rows[i - 1].time);

    const current =
      Number(state.rows[i].time);

    if (current < previous) {
      return {
        index: i,
        previous,
        current
      };
    }
  }

  return null;
}

async function exportScenario() {
  if (!state.rows.length) {
    alert("Timelineに行がありません。");
    return;
  }

  const invalid = validateAll(false);
  if (invalid.length) {
    const first = invalid[0];
    state.selectedIndex = first.index;
    renderAll();

    alert(
      formatValidationErrors(
        invalid,
        "保存できません"
      )
    );
    return;
  }

  const timeOrderError =
    findTimelineTimeOrderError();

  if (timeOrderError) {
    state.selectedIndex =
      timeOrderError.index;

    renderAll();

    alert(
      "保存できません\n\n" +
      "Timeの並び順が不正です。\n\n" +
      `Row ${timeOrderError.index + 1}\n` +
      `  • Time: ${timeOrderError.current}\n` +
      `  • 前の行のTime: ${timeOrderError.previous}\n` +
      "  • Timeは前の行以上にしてください。"
    );

    return;
  }

  try {
    const timeline = state.rows.map(row => {
      const cursor = { index: 0 };

      return {
        time: Number(row.time),
        execution: buildExecution(
          row.command,
          row.args,
          cursor,
          0
        )
      };
    });

    const json =
      JSON.stringify(timeline, null, 2);

    if ("showSaveFilePicker" in window) {
      state.timelineFileName =
        await saveTimelineWithPicker(json);

      renderAll();
      return;
    }

    downloadTimelineJson(json);
    state.timelineFileName = "timeline.json";
    renderAll();
  } catch (error) {
    if (error?.name === "AbortError") {
      return;
    }

    alert(error.message || String(error));
  }
}

async function saveTimelineWithPicker(json) {
  const handle =
    await window.showSaveFilePicker({
      id: "timeline-json",
      suggestedName:
        state.timelineFileName || "timeline.json",
      types: [
        {
          description: "Timeline JSON",
          accept: {
            "application/json": [".json"]
          }
        }
      ]
    });

  const writable =
    await handle.createWritable();

  try {
    await writable.write(json);
  } finally {
    await writable.close();
  }

  return handle.name || "timeline.json";
}

function downloadTimelineJson(json) {
  const blob = new Blob(
    [json],
    {
      type:
        "application/json;charset=utf-8"
    }
  );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "timeline.json";
  a.click();

  URL.revokeObjectURL(url);
}

function buildExecution(commandName, values, cursor, depth) {
  if (depth > MAX_COMMAND_NESTING) {
    throw new Error("Executionのネストが深すぎます。");
  }

  const def = state.definitions.get(commandName);
  if (!def) {
    throw new Error(`未定義のCommand '${commandName || "(empty)"}' です。`);
  }

  const argumentsObject = {};

  for (const arg of def.args) {
    const raw = String(values[cursor.index] ?? "").trim();
    cursor.index++;

    if (arg.type === "Command") {
      if (!raw) {
        throw new Error(`${getArgDisplayName(arg)} のCommandを選択してください。`);
      }

      setJsonPathValue(
        argumentsObject,
        arg.jsonPath,
        buildExecution(raw, values, cursor, depth + 1)
      );
      continue;
    }

    setJsonPathValue(
      argumentsObject,
      arg.jsonPath,
      editorTextToJsonValue(arg, raw)
    );
  }

  return {
    command: commandName,
    arguments: argumentsObject
  };
}

function setJsonPathValue(root, path, value) {
  let current = root;

  for (let i = 0; i < path.length - 1; i++) {
    const segment = path[i];

    if (!current[segment] ||
        typeof current[segment] !== "object" ||
        Array.isArray(current[segment])) {
      current[segment] = {};
    }

    current = current[segment];
  }

  current[path[path.length - 1]] = value;
}

function editorTextToJsonValue(arg, raw) {
  switch (arg.type) {
    case "Int":
      return Number.parseInt(raw, 10);

    case "Float":
      return Number(raw);

    case "Bool":
      return toBoolText(raw) === "true";

    case "Enum":
      return arg.multiSelect
        ? raw
            .split("|")
            .map(v => v.trim())
            .filter(Boolean)
            .join(", ")
        : raw;

    default:
      return raw;
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

$("definitionFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    loadDefinitions(await file.text(), file.name);
  } catch (err) {
    alert(err.message || String(err));
  } finally {
    e.target.value = "";
  }
});

$("scenarioFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    importScenario(
      await file.text(),
      file.name
    );
  } catch (err) {
    alert(err.message || String(err));
  } finally {
    e.target.value = "";
  }
});

$("repositoryReloadFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file || state.activeEditor === "scenario") return;

  try {
    loadRepository(
      state.activeEditor,
      await file.text(),
      file.name
    );
  } catch (err) {
    alert(err.message || String(err));
  } finally {
    e.target.value = "";
  }
});

$("repositorySaveBtn").addEventListener("click", () => {
  if (state.activeEditor === "scenario" ||
      state.activeEditor === "commandDefinitions") {
    return;
  }

  exportRepository(state.activeEditor);
});

$("repositoryAddIdBtn").addEventListener("click", () => {
  if (state.activeEditor === "scenario") return;
  addRepositoryId(state.activeEditor);
});

$("addBtn").addEventListener("click", addRow);
$("duplicateBtn").addEventListener("click", duplicateRow);
$("upBtn").addEventListener("click", () => moveRow(-1));
$("downBtn").addEventListener("click", () => moveRow(1));
$("validateBtn").addEventListener("click", () => validateAll(true));
$("exportBtn").addEventListener("click", exportScenario);

$("repositoryPreviewFolderInput").addEventListener(
  "change",
  event => {
    const files =
      event.target.files;

    if (!files?.length ||
        state.activeEditor === "scenario" ||
        state.activeEditor === "commandDefinitions") {
      event.target.value = "";
      return;
    }

    const source =
      state.activeEditor;

    state.repositoryPreviewFolders.set(
      source,
      buildRepositoryPreviewFolder(files)
    );

    updateRepositoryPreviewFolderStatus(source);

    const repo =
      state.repositories.get(source);

    const selectedRow =
      state.repositorySelections.get(source);

    if (repo &&
        Number.isInteger(selectedRow)) {
      renderRepositoryPreview(
        source,
        repo,
        selectedRow
      );
    }

    event.target.value = "";
  }
);

renderAll();
</script>
