<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Editor</title>
<style>
:root{
  --bg:#f5f7fa;
  --panel:#ffffff;
  --line:#d9dee7;
  --text:#20242a;
  --muted:#6b7280;
  --accent:#2563eb;
  --danger:#b42318;
  --ok:#067647;
  --warn:#b54708;
  --soft:#eef2f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,select{font:inherit}
button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:7px 11px;
  cursor:pointer;
}
button:hover{background:#f8fafc}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:not-allowed}
.app{
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr;
}
header{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;
  align-items:center;
}
header h1{font-size:18px;margin:0}
.repo-group{
  margin-bottom:14px;
}
.repo-row{
  grid-template-columns:180px minmax(0,1fr) auto auto;
}
.repo-item{
  grid-template-columns:minmax(180px,1fr) minmax(260px,2fr) 110px auto;
}
@media(max-width:980px){
  .repo-row,
  .repo-item{
    grid-template-columns:1fr;
  }
}
.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(520px,1.3fr) minmax(360px,.7fr);
  gap:12px;
  padding:12px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  min-height:0;
  overflow:hidden;
}
.panel-header{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.editor-tabs{
  display:flex;
  align-items:flex-end;
  gap:0;
  flex:0 1 auto;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
.editor-tabs::-webkit-scrollbar{
  height:4px;
}
.editor-tabs::-webkit-scrollbar-thumb{
  background:transparent;
}
.editor-tabs:hover::-webkit-scrollbar-thumb{
  background:#d0d5dd;
}

.editor-tab{
  position:relative;
  flex:0 0 auto;
  height:39px;
  margin:0;
  padding:0 15px;
  border:0;
  border-radius:0;
  background:transparent;
  color:#667085;
  font-size:12px;
  font-weight:600;
  line-height:39px;
  white-space:nowrap;
  cursor:pointer;
}

.editor-tab:hover{
  background:transparent;
  color:#344054;
}

.editor-tab::after{
  content:"";
  position:absolute;
  left:15px;
  right:15px;
  bottom:0;
  height:2px;
  border-radius:2px 2px 0 0;
  background:transparent;
}

.editor-tab.active{
  color:#344054;
  background:transparent;
}

.editor-tab.active::after{
  background:var(--accent);
}

/* Keep the three roles readable without creating large empty gaps. */
.editor-tab.repository-tab.first-repository-tab{
  margin-left:0;
}

.editor-tab.reference-tab{
  margin-left:10px;
  padding-left:18px;
  padding-right:15px;
  color:#7b8494;
  font-weight:500;
}

.editor-tab.reference-tab::before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:1px;
  background:#e4e7ec;
}

.editor-tab.reference-tab:hover{
  color:#475467;
  background:transparent;
}

.editor-tab.reference-tab.active{
  color:#344054;
  background:transparent;
}

.editor-tab.reference-tab::after{
  left:18px;
  right:15px;
}
.editor-header{padding:0;align-items:stretch}
.editor-header-right{margin-left:auto;display:flex;align-items:center;padding:0 12px}
.editor-toolbar{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:48px}
.editor-toolbar.hidden{display:none}
.editor-content{min-height:0;height:100%}
.editor-content.hidden{display:none}

.panel-header h2{font-size:14px;margin:0}
.panel-body{padding:12px}
.scenario-panel{display:grid;grid-template-rows:auto auto 1fr}


.direct-table{
  table-layout:fixed;
  width:max-content;
  min-width:100%;
  border-collapse:separate;
  border-spacing:0;
}
.direct-table th,
.direct-table td{
  vertical-align:middle;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:0;
  background:#fff;
}
.direct-table th{
  height:34px;
  padding:0 8px;
  background:#f8fafc;
  color:#475467;
  font-weight:600;
  white-space:nowrap;
}
.direct-table th:first-child,
.direct-table td:first-child{
  border-left:1px solid var(--line);
}
.direct-table thead tr:first-child th{
  border-top:1px solid var(--line);
}
.grid-col-no{width:46px;min-width:46px;max-width:46px}
.grid-col-time{width:92px;min-width:92px;max-width:92px}
.grid-col-command{width:180px;min-width:180px;max-width:180px}
.grid-col-arg{width:170px;min-width:170px;max-width:170px}
.grid-col-status{width:92px;min-width:92px;max-width:92px}
.grid-col-actions{width:42px;min-width:42px;max-width:42px}

.grid-cell{
  height:54px;
  display:grid;
  align-items:stretch;
}
.grid-edit-cell{
  grid-template-rows:18px 1fr;
  padding:4px 6px 5px;
}
.grid-cell-label{
  font-size:10px;
  line-height:18px;
  color:#667085;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.grid-control{
  width:100%;
  height:28px;
  min-width:0;
  border:none;
  border-radius:0;
  padding:3px 5px;
  background:transparent;
  color:var(--text);
  outline:none;
}
.grid-control:focus{
  outline:2px solid #84adff;
  outline-offset:-2px;
  background:#fff;
}

.grid-checkbox-control{
  width:100%;
  height:28px;
  display:flex;
  align-items:center;
  padding:0 2px;
}

.grid-checkbox-control input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
  cursor:pointer;
}

.grid-checkbox-control:focus-within{
  outline:2px solid #84adff;
  outline-offset:-2px;
  background:#fff;
}

.grid-range-control{
  width:100%;
  height:28px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 58px;
  align-items:center;
  gap:6px;
  padding:0 2px;
}

.grid-range-control:focus-within{
  outline:2px solid #84adff;
  outline-offset:-2px;
  background:#fff;
}

.grid-range-input{
  width:100%;
  min-width:0;
  margin:0;
  accent-color:var(--accent);
  cursor:pointer;
}

.grid-range-control.is-unset .grid-range-input{
  opacity:.55;
}

.grid-range-number{
  width:58px;
  height:24px;
  min-width:0;
  margin:0;
  padding:2px 4px;
  border:1px solid #d0d5dd;
  border-radius:4px;
  background:#fff;
  color:#344054;
  outline:none;
  text-align:right;
  font-size:10.5px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

.grid-range-number:focus{
  border-color:#84adff;
  box-shadow:0 0 0 1px #84adff;
}

.grid-range-number::-webkit-inner-spin-button,
.grid-range-number::-webkit-outer-spin-button{
  margin:0;
}
select.grid-control{
  padding-right:20px;
  text-overflow:ellipsis;
}
.grid-multiselect{
  position:relative;
  width:100%;
  min-width:0;
}
.grid-multiselect summary{
  list-style:none;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.grid-multiselect summary::-webkit-details-marker{display:none}
.grid-multiselect-panel{
  position:absolute;
  z-index:50;
  top:30px;
  left:0;
  min-width:100%;
  max-height:220px;
  overflow:auto;
  padding:6px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  box-shadow:0 10px 24px rgba(16,24,40,.14);
}
.grid-multiselect-option{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 6px;
  white-space:nowrap;
}
.grid-multiselect-option:hover{background:#f8fafc}
.grid-multiselect-option input{margin:0}
.grid-edit-cell.invalid{
  background:#fff4f3;
}
.grid-edit-cell.invalid .grid-control{
  color:#b42318;
}
.grid-empty{
  height:54px;
  background:#fafafa;
}
.grid-simple-cell{
  height:54px;
  display:flex;
  align-items:center;
  padding:0 8px;
}
.grid-row-selected td{
  background:#eef4ff;
}
.grid-row-selected .grid-empty{
  background:#eef4ff;
}
.grid-row-selected .grid-control{
  background:transparent;
}
.row-status{
  font-weight:600;
  cursor:default;
}
.row-status.ok{color:var(--ok)}
.row-status.error{color:var(--danger)}

.row-delete-cell{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.row-delete-icon-button{
  width:28px;
  height:28px;
  min-width:28px;
  margin:0;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:5px;
  background:transparent;
  color:#98a2b3;
}

.row-delete-icon-button:hover{
  background:#fff4f3;
  color:var(--danger);
}

.row-delete-icon-button svg{
  width:15px;
  height:15px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.row-actions{
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.table-wrap{overflow:auto;min-height:0;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{
  border-bottom:1px solid var(--line);
  padding:8px 9px;
  text-align:left;
  vertical-align:middle;
}
th{
  position:sticky;
  top:0;
  background:#f8fafc;
  z-index:1;
  font-weight:600;
  color:#475467;
}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f8fafc}
tbody tr.selected{background:#eef4ff}
.col-no{width:48px;color:var(--muted)}
.col-time{width:90px}
.col-command{width:160px}
.col-status{width:90px}
.status-ok{color:var(--ok);font-weight:600}
.status-error{color:var(--danger);font-weight:600}
.empty{
  padding:34px 18px;
  text-align:center;
  color:var(--muted);
}
.inspector{
  height:100%;
  overflow:auto;
}
.field{
  margin-bottom:14px;
}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:#475467;
  margin-bottom:5px;
}
.field .required{color:var(--danger);margin-left:3px}
.field input,.field select{
  width:100%;
  border:1px solid #cfd5df;
  border-radius:7px;
  padding:8px 9px;
  background:#fff;
}
.field input:focus,.field select:focus{
  outline:2px solid #c7d7fe;
  border-color:var(--accent);
}
.help{font-size:11px;color:var(--muted);margin-top:4px}
.field-error{font-size:11px;color:var(--danger);margin-top:4px}
.section{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.section-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
  color:#475467;
}
.repo-group{
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:9px;
  overflow:hidden;
}
.repo-row{
  display:grid;
  grid-template-columns:140px minmax(0,1fr) auto auto;
  align-items:center;
  gap:7px;
  padding:8px;
  background:#fff;
}
.repo-name{font-size:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.repo-status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-file{position:relative;overflow:hidden}
.repo-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.repo-items{
  border-top:1px solid var(--line);
  background:#f8fafc;
}
.repo-items summary{
  cursor:pointer;
  padding:8px 10px;
  font-size:12px;
  color:#475467;
  user-select:none;
}
.repo-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(140px,1fr) auto auto;
  gap:10px;
  align-items:center;
  padding:7px 10px;
  border-top:1px solid #e4e7ec;
  background:#fff;
}
.repo-item-id{
  font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  overflow-wrap:anywhere;
}
.repo-item-meta{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}
.repo-item-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.repo-small-btn{
  padding:4px 8px;
  font-size:11px;
}
.repo-add-row{
  display:flex;
  justify-content:flex-end;
  padding:8px 10px;
  border-top:1px solid #e4e7ec;
  background:#f8fafc;
}
.validation-box{
  background:#fff6ed;
  border:1px solid #fedf89;
  border-radius:8px;
  padding:9px 10px;
  margin-bottom:12px;
  font-size:12px;
  color:#7a2e0e;
}
.validation-box.ok{
  background:#ecfdf3;
  border-color:#abefc6;
  color:#05603a;
}
.spacer{flex:1}
@media(max-width:980px){
  .workspace{grid-template-columns:1fr;overflow:auto}
  .panel{min-height:440px}
}

</style>


<style id="calm-grid-style">
/* Calm, Excel-like grid: structure comes from alignment and light borders. */
.direct-table th{
  background:#f5f6f8;
  color:#344054;
  font-weight:600;
  border-color:#dfe3e8;
  border-bottom:1px solid #dfe3e8;
}

.direct-table tbody tr td{
  background:#fff;
  border-right:1px solid #e4e7ec;
  border-bottom:1px solid #e4e7ec;
}

/* Remove zebra striping and column-specific backgrounds. */
.direct-table tbody tr:nth-child(even) td,
td.grid-col-command .grid-edit-cell,
.grid-row-selected td,
.grid-row-selected .grid-edit-cell,
.grid-row-selected .grid-simple-cell,
.grid-row-selected .grid-empty{
  background:#fff !important;
}

/* Minimal selected-row cue: only a left accent. */
.grid-row-selected td:first-child{
  box-shadow:inset 3px 0 0 var(--accent);
}

/* Cell label: no band, no block background. */
.grid-edit-cell{
  padding:4px 6px 5px;
  grid-template-rows:18px 1fr;
  background:#fff;
}

.grid-cell-label{
  display:flex;
  align-items:center;
  padding:0;
  background:transparent;
  border:none;
  color:#667085;
  font-size:10px;
  font-weight:500;
  line-height:18px;
  letter-spacing:0;
}

/* Values remain visually quiet. */
.grid-control{
  height:28px;
  padding:3px 2px;
  border:none;
  border-radius:0;
  background:transparent;
  color:#101828;
  font-weight:400;
  outline:none;
}

td.grid-col-command .grid-control{
  font-weight:500;
  color:#101828;
}

.grid-control:hover:not(:disabled){
  background:#fafbfc;
}

.grid-control:focus{
  outline:2px solid #84adff;
  outline-offset:-2px;
  background:#fff;
}

/* Error state: no fill, only a red underline + text. */
.grid-edit-cell.invalid{
  background:#fff !important;
  box-shadow:none;
}

.grid-edit-cell.invalid .grid-cell-label{
  background:transparent;
  color:#b42318;
  border:none;
}

.grid-edit-cell.invalid .grid-control{
  color:#b42318;
  border-bottom:2px solid #f04438;
}

/* Status returns to plain text. */
.row-status,
.status-pill{
  display:inline;
  padding:0;
  border:none;
  border-radius:0;
  background:transparent !important;
  font-size:12px;
  font-weight:500;
}

.row-status.ok,
.status-pill.ok{
  color:#067647;
}

.row-status.error,
.status-pill.error{
  color:#b42318;
}

.status-symbol{
  display:none;
}

/* Keep the table dense and regular. */
.grid-cell,
.grid-empty,
.grid-simple-cell{
  min-height:54px;
}

/* Make the editable surface fill the complete table cell. */
.grid-edit-cell{
  position:relative;
  display:block;
  padding:0;
  overflow:visible;
}

.grid-edit-cell > .grid-cell-label{
  position:absolute;
  z-index:2;
  top:5px;
  left:8px;
  right:8px;
  height:16px;
  line-height:16px;
  pointer-events:none;
}

.grid-edit-cell > .grid-cell-label:empty{
  display:none;
}

.grid-edit-cell > .grid-control{
  display:block;
  width:100%;
  height:100%;
  min-height:54px;
  padding:0 8px;
  cursor:text;
}

.grid-edit-cell > select.grid-control{
  padding-right:26px;
  cursor:pointer;
}

.grid-edit-cell > .grid-cell-label:not(:empty) + .grid-control{
  padding:18px 8px 3px;
}

.grid-edit-cell > .grid-cell-label:not(:empty) + select.grid-control{
  padding:18px 26px 3px 8px;
}

.grid-edit-cell > .grid-checkbox-control,
.grid-edit-cell > .grid-range-control{
  position:absolute;
  left:6px;
  right:6px;
  top:22px;
  width:auto;
  height:28px;
}

.grid-edit-cell > .grid-multiselect{
  width:100%;
  height:100%;
}

.grid-edit-cell > .grid-multiselect > summary.grid-control{
  display:flex;
  align-items:center;
  width:100%;
  height:100%;
  min-height:54px;
  padding:0 26px 0 8px;
  cursor:pointer;
}

.grid-edit-cell > .grid-cell-label:not(:empty) + .grid-multiselect > summary.grid-control{
  align-items:flex-end;
  padding:18px 26px 7px 8px;
}

.grid-edit-cell > .grid-multiselect > .grid-multiselect-panel{
  top:54px;
}

/* Keep the selected row unmistakable while preserving cell readability. */
.direct-table tbody tr.grid-row-selected > td,
.direct-table tbody tr.grid-row-selected > td .grid-edit-cell,
.direct-table tbody tr.grid-row-selected > td .grid-simple-cell,
.direct-table tbody tr.grid-row-selected > td .grid-empty{
  background:#eaf2ff !important;
}

.direct-table tbody tr.grid-row-selected > td:first-child{
  box-shadow:inset 4px 0 0 #2563eb;
}

.direct-table tbody tr.grid-row-selected > td:first-child .grid-simple-cell{
  color:#175cd3;
  font-weight:700;
}


/* ============================================================
   Command Definitions / Repository
   Single canonical style block for these two editor pages.
   ============================================================ */

.repository-editor{
  height:100%;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px;
}

.repository-empty{
  width:min(720px, 100%);
  padding:34px 18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}


/* Shared page meta */
#scenarioContent .repository-meta,
#repositoryContent .repository-meta,
#commandDefinitionContent .repository-meta{
  width:min(720px, 100%);
  max-width:720px;
  min-width:0;
  display:flex;
  align-items:center;
  flex-wrap:nowrap;
  gap:0;
  margin-bottom:10px;
  padding:0 1px;
  color:#667085;
  font-size:12px;
  line-height:1.35;
  letter-spacing:.005em;
}


.file-meta-icon{
  position:relative;
  width:13px;
  height:16px;
  flex:0 0 13px;
  margin-right:7px;
  border:1.4px solid #98a2b3;
  border-radius:2px;
}

.file-meta-icon::before{
  content:"";
  position:absolute;
  top:-1.4px;
  right:-1.4px;
  width:5px;
  height:5px;
  background:#fff;
  border-left:1.4px solid #98a2b3;
  border-bottom:1.4px solid #98a2b3;
}

.repo-meta-file{
  min-width:0;
  max-width:360px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#667085;
}

.repo-meta-count{
  flex:0 0 auto;
  margin-left:8px;
  padding-left:9px;
  border-left:1px solid #d0d5dd;
  white-space:nowrap;
  text-align:left;
  color:#98a2b3;
  font-variant-numeric:tabular-nums;

<body>
<div class="app">

<script>
"use strict";

const state = {
  definitions: new Map(),
  definitionOrder: [],
  definitionDocument: { commands: [] },
  definitionFileName: "",
  repositories: new Map(),
  rows: [],
  selectedIndex: -1,
  timeSortDirection: null,
  commandSortDirection: null,
  activeEditor: "scenario",
  repositorySelections: new Map(),
  repositoryPreviewFiles: new WeakMap(),
  repositoryPreviewFolders: new Map(),
  repositoryPreviewFileUrls: new WeakMap(),
  timelineFileName: ""
};

const $ = (id) => document.getElementById(id);

function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = "";
  let i = 0;
  let quoted = false;

  while (i < text.length) {
    const ch = text[i];

    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i += 2;
          continue;
        }
        quoted = false;
        i++;
        continue;
      }
      field += ch;
      i++;
      continue;
    }

    if (ch === '"') {
      quoted = true;
      i++;
    } else if (ch === ",") {
      row.push(field);
      field = "";
      i++;
    } else if (ch === "\r") {
      if (text[i + 1] === "\n") i++;
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
      i++;
    } else if (ch === "\n") {
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
      i++;
    } else {
      field += ch;
      i++;
    }
  }

  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }

  return rows.filter(r => r.some(v => v.trim() !== ""));
}

function csvEscape(value) {
  const s = value == null ? "" : String(value);
  if (/[",\r\n]/.test(s)) return '"' + s.replaceAll('"', '""') + '"';
  return s;
}

function rowsToObjects(rows) {
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(values => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i] ?? "");
    return obj;
  });
}

function toBoolText(value) {
  const s = String(value ?? "").trim().toLowerCase();
  if (s === "true" || s === "1") return "true";
  if (s === "false" || s === "0") return "false";
  return "";
}

function normalizeType(type) {
  const t = String(type || "String").trim().toLowerCase();
  if (["float","double","number"].includes(t)) return "Float";
  if (["int","integer"].includes(t)) return "Int";
  if (["bool","boolean"].includes(t)) return "Bool";
  if (["enum"].includes(t)) return "Enum";
  if (["command"].includes(t)) return "Command";
  if (["repositorykey","repository_key","repo_key"].includes(t)) return "RepositoryKey";
  if (["id"].includes(t) || t.endsWith("id")) return "RepositoryKey";
  return "String";
}

function loadDefinitions(text, fileName = "") {
  let document;
  try {
    document = JSON.parse(text);
  } catch {
    throw new Error("Command Definition JSONの形式が不正です。");
  }

  if (!document || !Array.isArray(document.commands)) {
    throw new Error("Command Definition JSONに 'commands' 配列が必要です。");
  }

  const defs = new Map();
  const order = [];
  const sources = new Set();

  for (const command of document.commands) {
    const commandName = String(command?.id ?? "").trim();
    if (!commandName) {
      throw new Error("Command Definitionに空のCommand IDがあります。");
    }
    if (defs.has(commandName)) {
      throw new Error(`Command ID '${commandName}' が重複しています。`);
    }
    if (!Array.isArray(command.parameters)) {
      throw new Error(`${commandName}: parameters 配列が必要です。`);
    }

    const args = [];
    let index = 1;

    for (const parameter of command.parameters) {
      index = appendDefinitionArgument(
        args,
        parameter,
        parameter?.name ?? "",
        [],
        index,
        null,
        ""
      );
    }

    defs.set(commandName, {
      name: commandName,
      args
    });
    order.push(commandName);

    for (const arg of args) {
      if (arg.source) sources.add(arg.source);
    }
  }

  state.definitions = defs;
  state.definitionOrder = order;
  state.definitionDocument = document;
  state.definitionFileName = fileName;

  for (const existing of [...state.repositories.keys()]) {
    if (!sources.has(existing)) {
      state.repositories.delete(existing);
    }
  }

  for (const source of sources) {
    if (!state.repositories.has(source)) {
      state.repositories.set(source, {
        ids: [],
        fileName: "",
        loaded: false
      });
    }
  }

  if (state.activeEditor !== "scenario" &&
      state.activeEditor !== "commandDefinitions" &&
      !state.repositories.has(state.activeEditor)) {
    state.activeEditor = "scenario";
  }

  for (const row of state.rows) {
    if (!state.definitions.has(row.command)) {
      row.command = "";
      row.args = [];
    }
  }
  renderAll();
}

function appendDefinitionArgument(
  result,
  definition,
  rootName,
  memberPath,
  index,
  inheritedSource,
  inheritedDescription
) {
  const type = String(definition?.type ?? "").trim().toLowerCase();
  const name = String(rootName ?? "").trim();
  const description = String(
    definition?.description ??
    inheritedDescription ??
    ""
  ).trim();

  if (!name) {
    throw new Error("Command Definitionにnameのないparameter/propertyがあります。");
  }

  if (type === "object") {
    const properties = definition.properties;
    if (!Array.isArray(properties)) {
      throw new Error(`${name}: objectにはproperties配列が必要です。`);
    }

    const source = definition.source || inheritedSource || "";
    let nextIndex = index;

    for (const property of properties) {
      nextIndex = appendDefinitionArgument(
        result,
        property,
        name,
        [...memberPath, property?.name ?? ""],
        nextIndex,
        source,
        description
      );
    }

    return nextIndex;
  }

  const jsonPath = [name, ...memberPath];
  const memberText = memberPath.join(".");

  if (type === "execution") {
    result.push({
      index,
      name,
      memberPath: memberText,
      jsonPath,
      type: "Command",
      required: true,
      source: "",
      defaultValue: "",
      min: "",
      max: "",
      options: [],
      multiSelect: false,
      description
    });
    return index + 1;
  }

  const mappedType = definitionTypeToEditorType(type);
  if (!mappedType) {
    throw new Error(`${name}: 未対応のDefinition type '${definition.type}' です。`);
  }

  result.push({
    index,
    name,
    memberPath: memberText,
    jsonPath,
    type: mappedType,
    required:
      mappedType !== "String" ||
      Boolean(definition.source || inheritedSource),
    source: definition.source || inheritedSource || "",
    defaultValue:
      mappedType === "Bool" ? "false" : "",
    min: definition.min ?? "",
    max: definition.max ?? "",
    options: Array.isArray(definition.options)
      ? definition.options.map(String)
      : [],
    multiSelect: Boolean(definition.multiSelect),
    description
  });

  return index + 1;
}

function definitionTypeToEditorType(type) {
  switch (type) {
    case "string": return "String";
    case "int": return "Int";
    case "float": return "Float";
    case "bool": return "Bool";
    case "enum": return "Enum";
    default: return null;
  }
}

const MAX_COMMAND_NESTING = 12;

function getArgDisplayName(arg) {
  return arg.memberPath
    ? `${arg.name}.${arg.memberPath}`
    : arg.name;
}

function getAssignableCommands() {
  return [...state.definitionOrder];
}

function getEffectiveArgDefinitions(row) {
  const result = [];
  let cursor = 1;

  function append(commandName, path, depth) {
    if (depth > MAX_COMMAND_NESTING) return;

    const def = state.definitions.get(commandName);
    if (!def) return;

    for (const baseArg of def.args) {
      const key = `${path}${commandName}#${baseArg.index}`;
      const effective = {
        ...baseArg,
        index: cursor++,
        key
      };
      result.push(effective);

      if (baseArg.type === "Command") {
        const nestedCommand = String(
          row.args[effective.index - 1] ?? ""
        ).trim();

        if (nestedCommand && state.definitions.has(nestedCommand)) {
          append(nestedCommand, `${key}>`, depth + 1);
        }
      }
    }
  }

  append(row.command, "root>", 0);
  return result;
}

function rebuildDynamicArguments(row, changedArg, newValue) {
  const oldDefs = getEffectiveArgDefinitions(row);
  const valuesByKey = new Map();

  for (const arg of oldDefs) {
    valuesByKey.set(
      arg.key,
      String(row.args[arg.index - 1] ?? arg.defaultValue ?? "")
    );
  }

  valuesByKey.set(changedArg.key, newValue);

  const newArgs = [];
  let cursor = 1;

  function append(commandName, path, depth) {
    if (depth > MAX_COMMAND_NESTING) return;

    const def = state.definitions.get(commandName);
    if (!def) return;

    for (const baseArg of def.args) {
      const key = `${path}${commandName}#${baseArg.index}`;
      const value = valuesByKey.has(key)
        ? valuesByKey.get(key)
        : String(baseArg.defaultValue ?? "");

      newArgs[cursor - 1] = value;
      cursor++;

      if (baseArg.type === "Command") {
        const nestedCommand = String(value ?? "").trim();
        if (nestedCommand && state.definitions.has(nestedCommand)) {
          append(nestedCommand, `${key}>`, depth + 1);
        }
      }
    }
  }

  append(row.command, "root>", 0);
  row.args = newArgs;
}

function createDefaultArgs(commandName) {
  const def = state.definitions.get(commandName);
  if (!def) return [];

  const maxIndex = def.args.reduce((m,a) => Math.max(m,a.index), 0);
  const args = Array(maxIndex).fill("");

  for (const arg of def.args) {
    args[arg.index - 1] = arg.defaultValue ?? "";
  }

  return args;
}

function loadRepository(sourceName, text, fileName) {
  const rows = parseCsv(text);
  if (!rows.length) throw new Error("Repository CSVが空です。");

  const headers = rows[0].map(h => h.trim());
  let idIndex = headers.findIndex(h => ["id","Id","ID"].includes(h));
  if (idIndex < 0) idIndex = 0;

  const ids = rows.slice(1)
    .map(r => (r[idIndex] ?? "").trim())
    .filter(Boolean);

  const duplicates = ids.filter((v, i) => ids.indexOf(v) !== i);
  if (duplicates.length) {
    throw new Error(`${sourceName}: IDが重複しています: ${[...new Set(duplicates)].join(", ")}`);
  }

  state.repositories.set(sourceName, {
    ids,
    fileName,
    loaded: true,
    headers,
    dataRows: rows.slice(1).map(r => [...r]),
    idIndex
  });

  renderAll();
}

function importScenario(text, fileName = "") {
  if (!state.definitions.size) {
    throw new Error("先にCommand Definition JSONを読み込んでください。");
  }

  let timeline;
  try {
    timeline = JSON.parse(text);
  } catch {
    throw new Error("Timeline JSONの形式が不正です。");
  }

  if (!Array.isArray(timeline)) {
    throw new Error("Timeline JSONのルートは配列である必要があります。");
  }

  state.rows = timeline.map((eventData, index) => {
    if (!eventData || typeof eventData !== "object") {
      throw new Error(`Event ${index + 1}: objectではありません。`);
    }

    const execution = eventData.execution;
    if (!execution || typeof execution !== "object") {
      throw new Error(`Event ${index + 1}: executionがありません。`);
    }

    const command = String(execution.command ?? "").trim();
    if (!state.definitions.has(command)) {
      throw new Error(
        `Event ${index + 1}: 未定義のCommand '${command || "(empty)"}' です。`
      );
    }

    const args = [];
    appendExecutionValues(execution, args, 0);

    return {
      time: String(eventData.time ?? ""),
      command,
      args
    };
  });

  state.timelineFileName = fileName;
  state.selectedIndex = state.rows.length ? 0 : -1;
  renderAll();
}

function appendExecutionValues(execution, values, depth) {
  if (depth > MAX_COMMAND_NESTING) {
    throw new Error("Executionのネストが深すぎます。");
  }

  const commandName = String(execution?.command ?? "").trim();
  const def = state.definitions.get(commandName);
  if (!def) {
    throw new Error(`未定義のCommand '${commandName || "(empty)"}' です。`);
  }

  const argumentsObject =
    execution.arguments &&
    typeof execution.arguments === "object" &&
    !Array.isArray(execution.arguments)
      ? execution.arguments
      : {};

  for (const arg of def.args) {
    const value = getJsonPathValue(
      argumentsObject,
      arg.jsonPath
    );

    if (arg.type === "Command") {
      const nested = value;
      const nestedCommand = String(nested?.command ?? "").trim();
      values.push(nestedCommand);

      if (nestedCommand) {
        appendExecutionValues(nested, values, depth + 1);
      }
      continue;
    }

    values.push(jsonValueToEditorText(arg, value));
  }
}

function getJsonPathValue(root, path) {
  let current = root;

  for (const segment of path ?? []) {
    if (!current ||
        typeof current !== "object" ||
        !Object.prototype.hasOwnProperty.call(current, segment)) {
      return undefined;
    }
    current = current[segment];
  }

  return current;
}

function jsonValueToEditorText(arg, value) {
  if (value === undefined || value === null) return "";

  if (arg.type === "Bool") {
    return value === true
      ? "true"
      : value === false
        ? "false"
        : String(value);
  }

  if (arg.type === "Enum" && arg.multiSelect) {
    return String(value)
      .split(",")
      .map(v => v.trim())
      .filter(Boolean)
      .join("|");
  }

  return String(value);
}

function validateArgumentValue(arg, raw) {
  const errors = [];
  const name = getArgDisplayName(arg);

  if (arg.required && raw === "") {
    errors.push(`${name}: 必須です。`);
    return errors;
  }
  if (raw === "") return errors;

  if (arg.type === "Float") {
    const n = Number(raw);
    if (!Number.isFinite(n)) {
      errors.push(`${name}: 数値で指定してください。`);
      return errors;
    }
    if (arg.min !== "" && n < Number(arg.min)) {
      errors.push(`${name}: ${arg.min} 以上にしてください。`);
    }
    if (arg.max !== "" && n > Number(arg.max)) {
      errors.push(`${name}: ${arg.max} 以下にしてください。`);
    }
  }

  if (arg.type === "Int") {
    const n = Number(raw);
    if (!Number.isInteger(n)) {
      errors.push(`${name}: 整数で指定してください。`);
      return errors;
    }
    if (arg.min !== "" && n < Number(arg.min)) {
      errors.push(`${name}: ${arg.min} 以上にしてください。`);
    }
    if (arg.max !== "" && n > Number(arg.max)) {
      errors.push(`${name}: ${arg.max} 以下にしてください。`);
    }
  }

  if (arg.type === "Bool" &&
      toBoolText(raw) === "") {
    errors.push(`${name}: true / false で指定してください。`);
  }

  if (arg.type === "Enum" && arg.options.length) {
    const values = arg.multiSelect
      ? raw.split("|").map(v => v.trim()).filter(Boolean)
      : [raw];

    const invalidValues =
      values.filter(v => !arg.options.includes(v));

    if (invalidValues.length) {
      errors.push(
        `${name}: 未定義の値 '${invalidValues.join("|")}' が指定されています。`
      );
    }

    if (arg.multiSelect &&
        new Set(values).size !== values.length) {
      errors.push(`${name}: 同じ値が複数回指定されています。`);
    }
  }

  if (arg.type === "Command" &&
      !state.definitions.has(raw)) {
    errors.push(`${name}: 未定義のCommand '${raw}' です。`);
  }

  if (arg.source) {
    const repo =
      state.repositories.get(arg.source);

    if (!repo || !repo.loaded) {
      errors.push(
        `${name}: Repository '${arg.source}' が読み込まれていません。`
      );
    } else if (!repo.ids.includes(raw)) {
      errors.push(
        `${name}: '${raw}' は ${arg.source} に存在しません。`
      );
    }
  }

  return errors;
}

function validateRow(row) {
  const errors = [];

  const time = Number(row.time);
  if (String(row.time).trim() === "" ||
      !Number.isFinite(time) ||
      time < 0) {
    errors.push("Time は0以上の数値で指定してください。");
  }

  const def = state.definitions.get(row.command);
  if (!def) {
    errors.push(`未定義のCommandです: ${row.command || "(empty)"}`);
    return errors;
  }

  const effectiveArgs = getEffectiveArgDefinitions(row);
  for (const arg of effectiveArgs) {
    const raw = String(row.args[arg.index - 1] ?? "").trim();
    errors.push(...validateArgumentValue(arg, raw));
  }

  return errors;
}

function validateAll(showDialog = false) {
  const all = state.rows.map((row, index) => ({
    index,
    errors: validateRow(row)
  }));

  const invalid =
    all.filter(x => x.errors.length);

  renderAll();

  if (showDialog) {
    if (!invalid.length) {
      alert(
        "検証結果\n\n" +
        "エラーはありません。"
      );
    } else {
      alert(
        formatValidationErrors(
          invalid,
          "検証エラー"
        )
      );
    }
  }

  return invalid;
}

function formatValidationErrors(
  invalid,
  title
) {
  const errorCount =
    invalid.reduce(
      (sum, item) => sum + item.errors.length,
      0
    );

  const lines = [
    title,
    "",
    `エラー ${errorCount}件 / ${invalid.length}行`,
    ""
  ];

  invalid.forEach((item, itemIndex) => {
    const row =
      state.rows[item.index];

    const command =
      row?.command || "(未選択)";

    lines.push(
      `Row ${item.index + 1}  |  Command: ${command}`
    );

    item.errors.forEach(error => {
      lines.push(`  • ${error}`);
    });

    if (itemIndex < invalid.length - 1) {
      lines.push("");
    }
  });

  return lines.join("\n");
}

function getScenarioMaxArgCount() {
  let maxArgs = 1;

  for (const def of state.definitions.values()) {
    for (const arg of def.args) {
      maxArgs = Math.max(maxArgs, arg.index);
    }
  }

  for (const row of state.rows) {
    maxArgs = Math.max(
      maxArgs,
      row.args.length,
      getEffectiveArgDefinitions(row).length
    );
  }

  return maxArgs;
}

function renderTable() {
  const body = $("scenarioBody");
  body.innerHTML = "";

  const maxArgs = getScenarioMaxArgCount();
  renderScenarioHead(maxArgs);

  const tableEmpty = $("tableEmpty");
  tableEmpty.style.display =
    state.definitionFileName
      ? "none"
      : "block";

  state.rows.forEach((row, rowIndex) => {
    const tr = document.createElement("tr");
    if (rowIndex === state.selectedIndex) {
      tr.classList.add("grid-row-selected");
    }

    tr.addEventListener("click", e => {
      if (e.target.closest?.(
        "input, select, option, button"
      )) {
        return;
      }

      state.selectedIndex = rowIndex;
      renderTableSelectionOnly();
    });

    // #
    const noTd = document.createElement("td");
    noTd.className = "grid-col-no";
    const noCell = document.createElement("div");
    noCell.className = "grid-simple-cell";
    noCell.textContent = String(rowIndex + 1);
    noTd.appendChild(noCell);
    tr.appendChild(noTd);

    // Time
    const timeTd = document.createElement("td");
    timeTd.className = "grid-col-time";
    timeTd.appendChild(createTimeGridCell(row, rowIndex));
    tr.appendChild(timeTd);

    // Command

    commandTd.className = "grid-col-command";
    commandTd.appendChild(createCommandGridCell(row, rowIndex));
    tr.appendChild(commandTd);

    // Arg1..ArgN
    const effectiveArgs = getEffectiveArgDefinitions(row);
    const argByIndex = new Map(
      effectiveArgs.map(arg => [arg.index, arg])
    );

    for (let argIndex = 1; argIndex <= maxArgs; argIndex++) {
      const argTd = document.createElement("td");
      argTd.className = "grid-col-arg";

      const arg = argByIndex.get(argIndex);

  });

function createTimeGridCell(row, rowIndex) {
  const cell = document.createElement("div");
  cell.className = "grid-cell grid-edit-cell";

  const label = document.createElement("div");
  label.className = "grid-cell-label";

  input.type = "number";
  input.min = "0";
  input.step = "any";
  input.className = "grid-control";

  const invalid =
    String(row.time).trim() === "" ||
    !Number.isFinite(Number(row.time)) ||
    Number(row.time) < 0;

  input.addEventListener("focus", () => {

    row.time = input.value;

      String(row.time).trim() === "" ||
      !Number.isFinite(Number(row.time)) ||
      Number(row.time) < 0;
    cell.classList.toggle("invalid", invalidNow);
    refreshRowStatus(input.closest("tr"), row);

function createCommandGridCell(row, rowIndex) {
  const cell = document.createElement("div");
  cell.className = "grid-cell grid-edit-cell";

  const label = document.createElement("div");
  label.className = "grid-cell-label";
  label.textContent = "";

  const picker = createSearchablePicker(
    row.command,
    state.definitionOrder,
    {
      searchPlaceholder: "Commandを検索",
      countLabel: "commands"
    }
  );

  const invalid =
    !state.definitions.has(row.command);
  cell.classList.toggle("invalid", invalid);

  picker.addEventListener("focusin", () => {
    state.selectedIndex = rowIndex;
    renderTableSelectionOnly();
  });

  picker.addEventListener("change", () => {
    row.command = picker.value;
    row.args = createDefaultArgs(row.command);
    state.selectedIndex = rowIndex;
    renderAll();
  });

  cell.append(label, picker);
  return cell;
}


function createSearchablePicker(
  current,
  options,
  settings = {}
) {
  const wrap = document.createElement("div");
  wrap.className = "grid-command-picker";

  const searchPlaceholder =
    settings.searchPlaceholder || "検索";
  const countLabel =
    settings.countLabel || "items";
  const disabledLabel =
    settings.disabledLabel || "-- select --";
  const disabled =
    Boolean(settings.disabled);

  let value = String(current ?? "");
  let filtered = [];
  let activeIndex = -1;
  let outsideHandler = null;

  const trigger = document.createElement("button");
  trigger.type = "button";
  trigger.className =
    "command-picker-trigger grid-control";

  const valueText = document.createElement("span");
  valueText.className = "command-picker-value";

  const chevron = document.createElement("span");
  chevron.className = "command-picker-chevron";
  chevron.setAttribute("aria-hidden", "true");

  trigger.append(valueText, chevron);

  const popup = document.createElement("div");
  popup.className = "command-picker-popup";
  popup.hidden = true;

  const searchRow = document.createElement("div");
  searchRow.className = "command-picker-search-row";

  const search = document.createElement("input");
  search.type = "search";
  search.className = "command-picker-search";
  search.placeholder = searchPlaceholder;
  search.autocomplete = "off";
  search.spellcheck = false;

  searchRow.appendChild(search);

  const meta = document.createElement("div");
  meta.className = "command-picker-meta";

  const list = document.createElement("div");
  list.className = "command-picker-list";

  popup.append(searchRow, meta, list);
  wrap.append(trigger, popup);

  Object.defineProperty(wrap, "value", {
    configurable: true,
    get: () => value
  });

  function updateTrigger() {
    const empty = value === "";
    valueText.textContent =
      disabled
        ? disabledLabel
        : empty
          ? "-- select --"
          : value;

    valueText.classList.toggle(
      "is-empty",
      empty || disabled
    );

    trigger.title =
      disabled ? disabledLabel : value;
    trigger.disabled = disabled;
  }

  function getCandidates() {
    const query =
      search.value.trim().toLowerCase();

    const matches = options.filter(name =>
      name.toLowerCase().includes(query)
    );

    if (query === "") {
      return [
        { value: "", label: "-- select --" },
        ...matches.map(name => ({
          value: name,
          label: name
        }))
      ];
    }

    return matches.map(name => ({
      value: name,
      label: name
    }));
  }

  function renderOptions(
    preferredValue = null
  ) {
    filtered = getCandidates();
    list.innerHTML = "";

    const commandCount =
      filtered.filter(x => x.value !== "").length;

    meta.textContent =
      `${commandCount} / ${options.length} ${countLabel}`;

    if (!filtered.length) {
      activeIndex = -1;

      const empty =
        document.createElement("div");
      empty.className =
        "command-picker-no-results";
      empty.textContent =
        "一致するCommandがありません";
      list.appendChild(empty);
      return;
    }

    const preferredIndex =
      preferredValue === null
        ? -1
        : filtered.findIndex(
            x => x.value === preferredValue
          );

    if (preferredIndex >= 0) {
      activeIndex = preferredIndex;
    } else {
      activeIndex = Math.min(
        Math.max(activeIndex, 0),
        filtered.length - 1
      );
    }

    filtered.forEach((candidate, index) => {
      const option =
        document.createElement("button");

      option.type = "button";
      option.className =
        "command-picker-option";

      option.classList.toggle(
        "is-active",
        index === activeIndex
      );

      option.classList.toggle(
        "is-current",
        candidate.value === value
      );

      option.classList.toggle(
        "is-empty-option",
        candidate.value === ""
      );

      option.textContent = candidate.label;
      option.title = candidate.label;

      option.addEventListener(
        "mouseenter",
        () => {
          activeIndex = index;
          updateActiveOption();
        }
      );

      option.addEventListener(
        "pointerdown",
        event => {
          event.preventDefault();
          event.stopPropagation();
          chooseCommand(candidate.value);
        }
      );

      option.addEventListener(
        "click",
        event => {
          event.preventDefault();
          event.stopPropagation();
        }
      );

      list.appendChild(option);
    });
  }

  function updateActiveOption() {
    const options =
      list.querySelectorAll(
        ".command-picker-option"
      );

    options.forEach((option, index) => {
      option.classList.toggle(
        "is-active",
        index === activeIndex
      );
    });

    options[activeIndex]?.scrollIntoView({
      block: "nearest"
    });
  }

  function moveActive(delta) {
    if (!filtered.length)
      return;

    activeIndex =
      (activeIndex + delta + filtered.length) %
      filtered.length;

    updateActiveOption();
  }

  function chooseCommand(nextValue) {
    const changed =
      value !== nextValue;

    value = nextValue;
    updateTrigger();
    closePicker(true);

    if (changed) {
      wrap.dispatchEvent(
        new Event("change", {
          bubbles: false
        })
      );
    }
  }

  function openPicker() {
    if (disabled || !popup.hidden)
      return;

    popup.hidden = false;
    wrap.classList.add("is-open");
    search.value = "";
    activeIndex = -1;

    renderOptions(value);

    outsideHandler = event => {
      if (!wrap.contains(event.target)) {
        closePicker(false);
      }
    };

    document.addEventListener(
      "pointerdown",
      outsideHandler,
      true
    );

    requestAnimationFrame(() => {
      search.focus();
      search.select();
    });
  }

  function closePicker(focusTrigger) {
    if (popup.hidden)
      return;

    popup.hidden = true;
    wrap.classList.remove("is-open");

    if (outsideHandler) {
      document.removeEventListener(
        "pointerdown",
        outsideHandler,
        true
      );
      outsideHandler = null;
    }

    if (focusTrigger) {
      trigger.focus();
    }
  }

  trigger.addEventListener("click", event => {
    event.stopPropagation();

    if (popup.hidden) {
      openPicker();
    } else {
      closePicker(false);
    }
  });

  trigger.addEventListener("keydown", event => {
    if (event.key === "ArrowDown" ||
        event.key === "Enter") {
      event.preventDefault();
      openPicker();
    }
  });

  search.addEventListener("input", () => {
    activeIndex = -1;
    renderOptions();
  });

  search.addEventListener("keydown", event => {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      moveActive(1);
      return;
    }

    if (event.key === "ArrowUp") {
      event.preventDefault();
      moveActive(-1);
      return;
    }

    if (event.key === "Enter") {
      event.preventDefault();

      if (activeIndex >= 0 &&
          activeIndex < filtered.length) {
        chooseCommand(
          filtered[activeIndex].value
        );
      }
      return;
    }

    if (event.key === "Escape") {
      event.preventDefault();
      closePicker(true);
    }
  });

  popup.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      event.preventDefault();
      closePicker(true);
    }
  });

  updateTrigger();
  return wrap;
}

function createMultiSelectGridControl(arg, current) {
  const details = document.createElement("details");
  details.className = "grid-multiselect";

  const summary = document.createElement("summary");
  summary.className = "grid-control";
  details.appendChild(summary);

  const panel = document.createElement("div");
  panel.className = "grid-multiselect-panel";
  details.appendChild(panel);

  const selected = new Set(
    String(current || "")
      .split("|")
      .map(v => v.trim())
      .filter(Boolean)
  );

  const checkboxes = [];
  for (const option of arg.options) {
    const label = document.createElement("label");
    label.className = "grid-multiselect-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = option;
    checkbox.checked = selected.has(option);
    checkboxes.push(checkbox);

    const text = document.createElement("span");
    text.textContent = option;
    label.append(checkbox, text);
    panel.appendChild(label);
  }

  const readValue = () => checkboxes
    .filter(c => c.checked)
    .map(c => c.value)
    .join("|");

  const updateSummary = () => {
    const values = checkboxes
      .filter(c => c.checked)
      .map(c => c.value);

    if (values.length === 0) {
      summary.textContent = "-- select --";
    } else if (values.length === 1) {
      summary.textContent = values[0];
    } else {
      summary.textContent = `${values[0]} +${values.length - 1}`;
    }

    summary.title = values.join(", ");
  };

  Object.defineProperty(details, "value", {
    configurable: true,
    get: readValue
  });

  for (const checkbox of checkboxes) {
    checkbox.addEventListener("change", () => {
      updateSummary();
      details.dispatchEvent(new Event("change", { bubbles: false }));
    });
  }

  updateSummary();
  return details;
}

function createBoolGridControl(current) {
  const wrap = document.createElement("div");
  wrap.className = "grid-checkbox-control";

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";

  let value = toBoolText(current);
  if (value === "")
    value = "false";

  checkbox.checked = value === "true";

  Object.defineProperty(wrap, "value", {
    configurable: true,
    get: () => value
  });

  checkbox.addEventListener("change", () => {
    value = checkbox.checked ? "true" : "false";
    wrap.dispatchEvent(
      new Event("change", { bubbles: false })
    );
  });

  wrap.appendChild(checkbox);
  return wrap;
}

function hasSliderRange(arg) {
  if (!["Float", "Int"].includes(arg.type))
    return false;

  if (arg.min === "" || arg.max === "")
    return false;

  const min = Number(arg.min);
  const max = Number(arg.max);

  return Number.isFinite(min) &&
    Number.isFinite(max) &&
    min <= max;
}

function createRangeGridControl(arg, current) {
  const wrap = document.createElement("div");
  wrap.className = "grid-range-control";

  const slider = createRangeSlider(arg);
  const numberInput = createRangeNumberInput(arg);

  let value = String(current ?? "");
  initializeRangeControl(
    wrap,
    slider,
    numberInput,
    arg,
    value
  );

  Object.defineProperty(wrap, "value", {
    configurable: true,
    get: () => value
  });

  slider.addEventListener("input", () => {
    value = normalizeSliderValue(
      arg,
      slider.value
    );

    slider.value = value;
    numberInput.value = value;
    wrap.classList.remove("is-unset");
    dispatchGridControlChange(wrap);
  });

  numberInput.addEventListener("input", () => {
    value = numberInput.value;
    syncSliderFromNumber(slider, arg, value);
    wrap.classList.toggle(
      "is-unset",
      value.trim() === ""
    );
    dispatchGridControlChange(wrap);
  });

  numberInput.addEventListener("change", () => {
    value = normalizeManualRangeValue(
      arg,
      value
    );

    numberInput.value = value;
    syncSliderFromNumber(slider, arg, value);
    wrap.classList.toggle(
      "is-unset",
      value.trim() === ""
    );
    dispatchGridControlChange(wrap);
  });

  wrap.append(slider, numberInput);
  return wrap;
}

function createRangeSlider(arg) {
  const slider = document.createElement("input");
  slider.type = "range";
  slider.className = "grid-range-input";

  const bounds = getSliderBounds(arg);
  slider.min = bounds.min;
  slider.max = bounds.max;
  slider.step = arg.type === "Int" ? "1" : "0.01";
  slider.title = `${arg.min} – ${arg.max}`;

  return slider;
}

function createRangeNumberInput(arg) {
  const input = document.createElement("input");
  input.type = "number";
  input.className = "grid-range-number";
  input.min = String(arg.min);
  input.max = String(arg.max);
  input.step = arg.type === "Int" ? "1" : "0.01";
  return input;
}

function initializeRangeControl(
  wrap,
  slider,
  numberInput,
  arg,
  current
) {
  const numeric = Number(current);
  const hasValue =
    current.trim() !== "" &&
    Number.isFinite(numeric);

  if (!hasValue) {
    slider.value = slider.min;
    numberInput.value = "";
    wrap.classList.add("is-unset");
    return;
  }

  numberInput.value = current;
  syncSliderFromNumber(slider, arg, current);
}

function getSliderBounds(arg) {
  if (arg.type === "Int") {
    return {
      min: String(arg.min),
      max: String(arg.max)
    };
  }

  const min = Math.ceil(
    (Number(arg.min) - Number.EPSILON) * 100
  ) / 100;

  const max = Math.floor(
    (Number(arg.max) + Number.EPSILON) * 100
  ) / 100;

  if (min <= max) {
    return {
      min: formatTwoDecimalMax(min),
      max: formatTwoDecimalMax(max)
    };
  }

  return {
    min: formatTwoDecimalMax(Number(arg.min)),
    max: formatTwoDecimalMax(Number(arg.max))
  };
}

function normalizeSliderValue(arg, raw) {
  const number = Number(raw);

  if (arg.type === "Int")
    return String(Math.round(number));

  return formatTwoDecimalMax(number);
}

function normalizeManualRangeValue(
  arg,
  raw
) {
  const trimmed =
    String(raw ?? "").trim();

  if (trimmed === "")
    return "";

  const number = Number(trimmed);
  if (!Number.isFinite(number))
    return trimmed;

  const clamped = Math.min(
    Number(arg.max),
    Math.max(Number(arg.min), number)
  );

  if (arg.type === "Int")
    return String(Math.round(clamped));

  return formatTwoDecimalMax(clamped);
}

function formatTwoDecimalMax(value) {
  return Number(value.toFixed(2)).toString();
}

function syncSliderFromNumber(
  slider,
  arg,
  raw
) {
  const number = Number(raw);
  if (!Number.isFinite(number))
    return;

  const min = Number(slider.min);
  const max = Number(slider.max);
  const clamped = Math.min(
    max,
    Math.max(min, number)
  );

  slider.value =
    normalizeSliderValue(arg, String(clamped));
}

function dispatchGridControlChange(control) {
  control.dispatchEvent(
    new Event("change", { bubbles: false })
  );
}

function isCompositeGridControl(control) {
  return control.classList.contains("grid-multiselect") ||
    control.classList.contains("grid-checkbox-control") ||
    control.classList.contains("grid-range-control") ||
    control.classList.contains("grid-command-picker");
}

function createArgumentGridCell(row, rowIndex, arg) {
  const cell = document.createElement("div");
  cell.className = "grid-cell grid-edit-cell";

  const label = document.createElement("div");
  label.className = "grid-cell-label";
  label.textContent = getArgDisplayName(arg);
  label.title = getArgDisplayName(arg);

  let current = String(row.args[arg.index - 1] ?? "");

  if (arg.type === "Bool" &&
      toBoolText(current) === "") {
    current = "false";
    row.args[arg.index - 1] = current;
  }

  let control;

  if (arg.type === "Command") {
    control = createSearchablePicker(
      current,
      getAssignableCommands(),
      {
        searchPlaceholder: "Commandを検索",
        countLabel: "commands"
      }
    );
  } else if (arg.source) {
    const repo =
      state.repositories.get(arg.source);

    control = createSearchablePicker(
      current,
      repo?.loaded ? repo.ids : [],
      {
        searchPlaceholder: "IDを検索",
        countLabel: "IDs",
        disabled: !repo?.loaded,
        disabledLabel: "-- select --"
      }
    );
  } else if (arg.type === "Bool") {
    control = createBoolGridControl(current);
  } else if (hasSliderRange(arg)) {
    control = createRangeGridControl(arg, current);
  } else if (arg.type === "Enum" && arg.options.length && arg.multiSelect) {
    control = createMultiSelectGridControl(arg, current);
  } else if (arg.type === "Enum" && arg.options.length) {
    control = createSearchablePicker(
      current,
      arg.options,
      {
        searchPlaceholder: "値を検索",
        countLabel: "options"
      }
    );
  } else {
    control = document.createElement("input");
    control.type = ["Float", "Int"].includes(arg.type)
      ? "number"
      : "text";

    if (arg.type === "Int") control.step = "1";
    if (arg.type === "Float") control.step = "any";
    if (arg.min !== "") control.min = arg.min;
    if (arg.max !== "") control.max = arg.max;
    control.value = current;
  }

  if (!isCompositeGridControl(control)) {
    control.className = "grid-control";
  }

  if (!control.title) {
    control.title = current;
  }

  const errors = validateArgumentValue(
    arg,
    current.trim()
  );
  cell.classList.toggle("invalid", errors.length > 0);

  control.addEventListener(
    isCompositeGridControl(control) ? "focusin" : "focus",
    () => {
      state.selectedIndex = rowIndex;
      renderTableSelectionOnly();
    }
  );

  const commit = () => {
    row.args[arg.index - 1] = control.value;

    if (!control.classList.contains("grid-range-control")) {
      control.title = control.value;
    }

    if (arg.type === "Command") {
      rebuildDynamicArguments(row, arg, control.value);
      state.selectedIndex = rowIndex;
      renderAll();
      return;
    }

    const nextErrors = validateArgumentValue(
      arg,
      String(control.value).trim()
    );
    cell.classList.toggle("invalid", nextErrors.length > 0);

    refreshRowStatus(control.closest("tr"), row);
  };

  control.addEventListener("change", commit);

  if (control.tagName === "INPUT") {
    control.addEventListener("input", commit);
  }

  cell.append(label, control);
  return cell;
}

function createStatusGridCell(errors) {
  const wrap = document.createElement("div");
  wrap.className = "grid-simple-cell";

  const status = document.createElement("span");
  status.className =
    "row-status " + (errors.length ? "error" : "ok");
  status.textContent =
    errors.length ? `Error ${errors.length}` : "OK";

  if (errors.length) {
    status.title = errors.join("\n");
  }

  wrap.appendChild(status);
  return wrap;
}

function refreshRowStatus(tr, row) {
  if (!tr) return;

  const errors = validateRow(row);
  const statusTd = tr.querySelector("td.grid-col-status");
  if (statusTd) {
    statusTd.innerHTML = "";
    statusTd.appendChild(createStatusGridCell(errors));
  }
}

function getRepositoryReferenceRows(sourceName, id) {
  const referencedRows = new Set();

  state.rows.forEach((row, rowIndex) => {
    const def = state.definitions.get(row.command);
    if (!def) return;

    for (const arg of getEffectiveArgDefinitions(row)) {
      if (arg.source !== sourceName) continue;

      const value = String(row.args[arg.index - 1] ?? "").trim();
      if (value === id) {
        referencedRows.add(rowIndex);
      }
    }
  });

  return [...referencedRows];
}

function clearRepositoryReferences(sourceName, id) {
  state.rows.forEach(row => {
    const def = state.definitions.get(row.command);
    if (!def) return;

    for (const arg of getEffectiveArgDefinitions(row)) {
      if (arg.source !== sourceName) continue;

      const value = String(row.args[arg.index - 1] ?? "").trim();
      if (value === id) {
        row.args[arg.index - 1] = "";
      }
    }
  });
}

function replaceRepositoryReferences(sourceName, oldId, newId) {
  state.rows.forEach(row => {
    const def = state.definitions.get(row.command);
    if (!def) return;

    for (const arg of getEffectiveArgDefinitions(row)) {
      if (arg.source !== sourceName) continue;

      const value = String(row.args[arg.index - 1] ?? "").trim();
      if (value === oldId) {
        row.args[arg.index - 1] = newId;
      }
    }
  });
}

function validateRepositoryId(repo, id, ignoreId = null) {
  const value = String(id ?? "").trim();

  if (!value) {
    return "IDを入力してください。";
  }

  if (!/^[A-Za-z][A-Za-z0-9_-]*$/.test(value)) {
    return "IDは英字で始まり、英数字・_・- のみ使用できます。";
  }

  const duplicate = repo.ids.some(existing =>
    existing !== ignoreId && existing === value
  );

  if (duplicate) {
    return `ID "${value}" は既に存在します。`;
  }

  return null;
}

function getRepositoryPathIndex(repo) {
  if (!repo?.headers?.length) return -1;

  const pathIndex = repo.headers.findIndex(
    h => String(h).trim().toLowerCase() === "path"
  );

  return pathIndex;
}

function getRepositoryPath(repo, id) {
  const pathIndex = getRepositoryPathIndex(repo);
  if (pathIndex < 0) return "";

  const row = repo.dataRows.find(r =>
    String(r[repo.idIndex] ?? "").trim() === id
  );

  return row ? String(row[pathIndex] ?? "") : "";
}

function addRepositoryId(sourceName) {
  const repo = state.repositories.get(sourceName);
  if (!repo?.loaded) return;

  const newRow = Array(repo.headers.length).fill("");
  repo.dataRows.push(newRow);

  renderAll();
}
function renameRepositoryId(sourceName, oldId) {
  const repo = state.repositories.get(sourceName);
  if (!repo?.loaded) return;

  const newId = prompt(
    `"${oldId}" の新しいIDを入力してください。`,
    oldId
  );
  if (newId === null) return;

  const normalizedNewId = newId.trim();
  if (normalizedNewId === oldId) return;

  const error = validateRepositoryId(repo, normalizedNewId, oldId);
  if (error) {
    alert(error);
    return;
  }

  const referencedRows = getRepositoryReferenceRows(sourceName, oldId);

  const message = referencedRows.length > 0
    ? `"${oldId}" は Timeline の ${referencedRows.length} 行で使用されています。\n\nリネームすると、すべての参照を "${normalizedNewId}" に自動更新します。\n\nリネームしますか？`
    : `"${oldId}" を "${normalizedNewId}" にリネームしますか？`;

  if (!confirm(message)) return;

  repo.ids = repo.ids.map(id =>
    id === oldId ? normalizedNewId : id
  );

  for (const row of repo.dataRows) {
    if (String(row[repo.idIndex] ?? "").trim() === oldId) {
      row[repo.idIndex] = normalizedNewId;
    }
  }

  replaceRepositoryReferences(
    sourceName,
    oldId,
    normalizedNewId
  );

  renderAll();
}

function changeRepositoryPath(sourceName, id) {
  const repo = state.repositories.get(sourceName);
  if (!repo?.loaded) return;

  const pathIndex = getRepositoryPathIndex(repo);
  if (pathIndex < 0) {
    alert(`Repository "${sourceName}" に Path 列がありません。`);
    return;
  }

  const currentPath = getRepositoryPath(repo, id);

  const newPath = prompt(
    `"${id}" のPathを変更してください。`,
    currentPath
  );
  if (newPath === null) return;

  const normalizedPath = newPath.trim();
  if (!normalizedPath) {
    alert("Pathを空欄にはできません。");
    return;
  }

  const row = repo.dataRows.find(r =>
    String(r[repo.idIndex] ?? "").trim() === id
  );

  if (!row) {
    alert(`ID "${id}" のRepository行が見つかりません。`);
    return;
  }

  row[pathIndex] = normalizedPath;
  renderAll();
}

function deleteRepositoryId(sourceName, id) {
  const repo = state.repositories.get(sourceName);
  if (!repo?.loaded) return;

  const referencedRows = getRepositoryReferenceRows(sourceName, id);
  const count = referencedRows.length;

  const message = count > 0
    ? `"${id}" は Timeline の ${count} 行で使用されています。\n\n削除すると、そのIDが使われているすべての箇所を自動的に空欄にします。\n\n削除しますか？`
    : `"${id}" は Timeline では使用されていません。\n\n削除しますか？`;

  if (!confirm(message)) return;

  clearRepositoryReferences(sourceName, id);

  repo.ids = repo.ids.filter(x => x !== id);
  repo.dataRows = repo.dataRows.filter(r =>
    String(r[repo.idIndex] ?? "").trim() !== id
  );

  renderAll();
}

async function exportRepository(sourceName) {
  const repo = state.repositories.get(sourceName);
  if (!repo?.loaded) return;

  const csv = createRepositoryCsv(repo);
  const suggestedName =
    repo.fileName || `${sourceName}.csv`;

  try {
    if ("showSaveFilePicker" in window) {
      repo.fileName =
        await saveRepositoryWithPicker(
          csv,
          suggestedName
        );

      renderAll();
      return;
    }

    downloadRepositoryCsv(
      csv,
      suggestedName
    );
  } catch (error) {
    if (error?.name === "AbortError")
      return;

    alert(error.message || String(error));
  }
}

function createRepositoryCsv(repo) {
  const lines = [
    repo.headers.map(csvEscape).join(","),
    ...repo.dataRows.map(row =>
      repo.headers
        .map((_, i) => csvEscape(row[i] ?? ""))
        .join(",")
    )
  ];

  return "\uFEFF" + lines.join("\r\n");
}

async function saveRepositoryWithPicker(
  csv,
  suggestedName
) {
  const handle =
    await window.showSaveFilePicker({
      id: "repository-csv",
      suggestedName,
      types: [
        {
          description: "Repository CSV",
          accept: {
            "text/csv": [".csv"]
          }
        }
      ]
    });

  const writable =
    await handle.createWritable();

  try {
    await writable.write(csv);
  } finally {
    await writable.close();
  }

  return handle.name || suggestedName;
}

function downloadRepositoryCsv(
  csv,
  fileName
) {
  const blob = new Blob(
    [csv],
    { type: "text/csv;charset=utf-8" }
  );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = fileName;
  a.click();

  URL.revokeObjectURL(url);
}


function repositoryDisplayName(sourceName) {

}

function renderEditorTabs() {

}

function syncRepositoryIds(repo) {
  repo.ids = repo.dataRows
    .map(row => String(row[repo.idIndex] ?? "").trim())
    .filter(Boolean);
}

function commitRepositoryId(
  sourceName,
  repo,
  dataRow,
  oldId,
  input,
  cell
) {
  const newId = input.value.trim();
  const error = validateRepositoryId(repo, newId, oldId || null);

  cell.classList.toggle("invalid", Boolean(error));
  input.title = error || newId;

  if (error) return;

  if (newId === oldId) return;

  const referencedRows = oldId
    ? getRepositoryReferenceRows(sourceName, oldId)
    : [];

  if (oldId && referencedRows.length > 0) {
    const accepted = confirm(
      `"${oldId}" は Scenario の ${referencedRows.length} 行で使用されています。\n\n` +
      `IDを "${newId}" に変更すると、すべての参照も自動更新します。\n\n変更しますか？`
    );

    if (!accepted) {
      input.value = oldId;
      cell.classList.remove("invalid");
      input.title = oldId;
      return;
    }
  }

  dataRow[repo.idIndex] = newId;
  syncRepositoryIds(repo);

  if (oldId) {
    replaceRepositoryReferences(
      sourceName,
      oldId,
      newId
    );
  }

  renderAll();
}

function configureRepositoryInlineEdit(
  input
) {
  input.readOnly = true;

  input.addEventListener("mousedown", event => {
    if (input.readOnly) {
      event.preventDefault();
    }
  });

  input.addEventListener("dblclick", event => {
    event.stopPropagation();
    beginRepositoryInlineEdit(input);
  });

  input.addEventListener("blur", () => {
    endRepositoryInlineEdit(input);
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      input.blur();
    }

    if (event.key === "Escape") {
      input.blur();
    }
  });
}

function beginRepositoryInlineEdit(input) {
  if (input.disabled)
    return;

  input.readOnly = false;
  input.classList.add("repository-editing");
  input.focus();
  input.select();
}

function endRepositoryInlineEdit(input) {
  input.readOnly = true;
  input.classList.remove("repository-editing");
}

function createRepositoryIdCell(
  sourceName,
  repo,
  dataRow,
  rowIndex
) {
  const input = document.createElement("input");
  input.type = "text";
  input.className =
    "repo-definition-input repo-id-input";

  const oldId =
    String(dataRow[repo.idIndex] ?? "").trim();

  input.value = oldId;
  input.title = oldId;
  configureRepositoryInlineEdit(input);

  if (!oldId) {
    input.classList.add("invalid");
    input.title = "IDを入力してください。";
  }

  input.addEventListener("change", () => {
    const newId = input.value.trim();
    const error =
      validateRepositoryId(
        repo,
        newId,
        oldId || null
      );

    input.classList.toggle(
      "invalid",
      Boolean(error)
    );
    input.title = error || newId;

    if (error) return;

    if (newId === oldId) return;

    const referencedRows = oldId
      ? getRepositoryReferenceRows(
          sourceName,
          oldId
        )
      : [];

    if (oldId && referencedRows.length > 0) {
      const accepted = confirm(
        `"${oldId}" は Scenario の ${referencedRows.length} 行で使用されています。\n\n` +
        `IDを "${newId}" に変更すると、すべての参照も自動更新します。\n\n変更しますか？`
      );

      if (!accepted) {
        input.value = oldId;
        input.classList.remove("invalid");
        input.title = oldId;
        return;
      }
    }

    dataRow[repo.idIndex] = newId;
    syncRepositoryIds(repo);

    if (oldId) {
      replaceRepositoryReferences(
        sourceName,
        oldId,
        newId
      );
    }

    if (isSelectedRepositoryRow(
        sourceName,
        rowIndex)) {
      renderRepositoryPreview(
        sourceName,
        repo,
        rowIndex
      );
    }

    renderAll();
  });

  return input;
}
function createRepositoryPathCell(
  sourceName,
  repo,
  dataRow,
  rowIndex
) {
  const wrap = document.createElement("div");
  wrap.className = "repo-path-cell";

  const input = document.createElement("input");
  input.type = "text";
  input.className =
    "repo-definition-input repo-path-input";

  const pathIndex = getRepositoryPathIndex(repo);

  if (pathIndex < 0) {
    input.value = "";
    input.placeholder = "Path列がありません";
    input.disabled = true;
    wrap.appendChild(input);
    return wrap;
  }

  input.value = String(dataRow[pathIndex] ?? "");
  input.title = input.value;
  configureRepositoryInlineEdit(input);

  input.addEventListener("input", () => {
    dataRow[pathIndex] = input.value;
    input.title = input.value;

    if (isSelectedRepositoryRow(
        sourceName,
        rowIndex)) {
      renderRepositoryPreview(
        sourceName,

        rowIndex
      );
    }
  });

  const picker = document.createElement("label");
  picker.className = "repo-path-picker";
  picker.title = "ファイルを選択";
  picker.textContent = "⋯";

  picker.addEventListener("click", event => {
    event.stopPropagation();
    selectRepositoryRow(
      sourceName,

    );
  });

  const fileInput = document.createElement("input");
  fileInput.type = "file";

function buildRepositoryPreviewFolder(files) {
  const fileList = [...files];
  const byRelativePath = new Map();
  const byName = new Map();

  let rootName = "";

  for (const file of fileList) {
    const relativePath =
      normalizePreviewPath(
        file.webkitRelativePath || file.name
      );

    if (!rootName && file.webkitRelativePath) {
      rootName =
        file.webkitRelativePath.split("/")[0] || "";
    }

    byRelativePath.set(
      relativePath,
      file
    );

    const name =
      file.name.toLowerCase();

    const sameName =
      byName.get(name) ?? [];

    sameName.push(file);
    byName.set(name, sameName);
  }

  return {
    rootName,
    files: fileList,
    byRelativePath,
    byName
  };
}

function normalizePreviewPath(path) {
  return String(path ?? "")
    .trim()
    .replaceAll("\\", "/")
    .replace(/^file:\/+/i, "")
    .replace(/^\.\/+/, "")
    .replace(/\/+/g, "/")
    .toLowerCase();
}

function findRepositoryPreviewFile(
  sourceName,
  path
) {
  const folder =
    state.repositoryPreviewFolders.get(sourceName);

  if (!folder) return null;

  const target =
    normalizePreviewPath(path);

  if (!target) return null;

  const exact =
    folder.byRelativePath.get(target);

  if (exact) return exact;

  const withoutDrive =
    target.replace(/^[a-z]:\//, "");

  for (const [relativePath, file]
      of folder.byRelativePath.entries()) {
    const relativeWithoutRoot =
      stripPreviewRoot(
        relativePath,
        folder.rootName
      );

    if (withoutDrive === relativePath ||
        withoutDrive === relativeWithoutRoot ||
        withoutDrive.endsWith("/" + relativePath) ||
        withoutDrive.endsWith("/" + relativeWithoutRoot)) {
      return file;
    }
  }

  const fileName =
    target.split("/").pop();

  const sameName =
    folder.byName.get(fileName) ?? [];

  return sameName.length === 1
    ? sameName[0]
    : null;
}

function stripPreviewRoot(
  relativePath,
  rootName
) {
  const root =
    normalizePreviewPath(rootName);

  if (!root) return relativePath;

  const prefix = root + "/";

  return relativePath.startsWith(prefix)
    ? relativePath.slice(prefix.length)
    : relativePath;
}

function getRepositoryPreviewFileUrl(file) {
  let url =
    state.repositoryPreviewFileUrls.get(file);

  if (url) return url;

  url = URL.createObjectURL(file);

  state.repositoryPreviewFileUrls.set(
    file,
    url
  );

  return url;
}

function updateRepositoryPreviewFolderStatus(
  sourceName
) {
  const label =
    $("repositoryPreviewFolderName");

  if (!label) return;

  const folder =
    state.repositoryPreviewFolders.get(sourceName);

  label.classList.toggle(
    "hidden",
    !folder
  );

  label.textContent =
    folder
      ? folder.rootName ||
        `${folder.files.length} files`
      : "";

  label.title =
    folder
      ? `${folder.files.length} files`
      : "";
}

function setRepositoryPreviewFile(
  dataRow,
  file
) {
  const current =
    state.repositoryPreviewFiles.get(dataRow);

  if (current?.url) {
    URL.revokeObjectURL(current.url);
  }

  state.repositoryPreviewFiles.set(
    dataRow,
    {
      file,
      url: URL.createObjectURL(file)
    }
  );
}

function isSelectedRepositoryRow(
  sourceName,
  rowIndex
) {

    === rowIndex;
}

function selectRepositoryRow(
  sourceName,
  repo,
  rowIndex
) {

  state.repositorySelections.set(
    sourceName,
    rowIndex
  );

  updateRepositorySelectedRow(rowIndex);

  renderRepositoryPreview(
    sourceName,
    repo,
    rowIndex
  );
}

function endActiveRepositoryInlineEdit() {
  const editing =
    document.querySelector(
      "#repositoryTableHost .repository-editing"
    );

  if (editing) {
    editing.blur();
  }
}

function updateRepositorySelectedRow(
  rowIndex
) {
  const rows = document.querySelectorAll(
    "#repositoryTableHost tbody tr"
  );

  rows.forEach((row, index) => {
    row.classList.toggle(
      "repository-row-selected",
